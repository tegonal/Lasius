name: Build frontend application

permissions:
  contents: read

on:
  workflow_call:
  workflow_dispatch:
  #pull_request:
  push:
    paths:
      - "frontend/**"
    branches:
      - "**"
    tags-ignore:
      - "**"

jobs:
  build-frontend:
    name: Build frontend application for amd64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Enable Corepack
        run: corepack enable
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 24
          # Without it, setup-node can use an older 24.x release from the runner cache.
          check-latest: true
          cache: yarn
          cache-dependency-path: frontend/yarn.lock
      - name: build frontend
        working-directory: ./frontend
        run: |
          yarn --version
          yarn install --immutable
          yarn run lint
          yarn exec prettier --check .
          yarn exec vitest run
          yarn run build
